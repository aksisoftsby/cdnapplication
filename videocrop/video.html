<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Player M3U8 dengan Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body class="bg-light py-5">

    <div class="container">
        <h2 class="mb-4 text-center">M3U8 Video Player</h2>
        <div class="card shadow rounded p-4">
            <form id="m3u8Form">
                <div class="mb-3">
                    <label for="m3u8Url" class="form-label">Masukkan URL .m3u8:</label>
                    <input type="text" class="form-control" id="m3u8Url" placeholder="https://example.com/video.m3u8"
                        required>
                </div>
                <button type="submit" class="btn btn-primary">Play</button>
            </form>

            <div class="mt-4">
                <video id="video" class="w-100" height="360" controls></video>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('m3u8Form');
        const video = document.getElementById('video');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const url = document.getElementById('m3u8Url').value;

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                });
            } else {
                alert('Browser tidak mendukung pemutaran .m3u8.');
            }
        });
    </script>

</body>

</html>
