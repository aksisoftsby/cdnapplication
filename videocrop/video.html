<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U8 Player</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- hls.js untuk pemutaran HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        .player-container {
            max-width: 800px;
            margin: 20px auto;
        }

        #videoPlayer {
            width: 100%;
            background-color: #000;
        }

        .input-group {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container player-container">
        <h2 class="text-center mb-4">M3U8 Player</h2>

        <div class="card">
            <div class="card-body">
                <div class="input-group">
                    <input type="text" class="form-control" id="m3u8Url" placeholder="Masukkan URL M3U8">
                    <button class="btn btn-primary" id="playBtn">Play</button>
                </div>

                <div class="ratio ratio-16x9">
                    <video id="videoPlayer" controls></video>
                </div>

                <div class="mt-3">
                    <div class="form-text">Contoh URL: https://example.com/stream.m3u8</div>
                    <div id="errorMsg" class="text-danger mt-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const video = document.getElementById('videoPlayer');
            const playBtn = document.getElementById('playBtn');
            const m3u8Url = document.getElementById('m3u8Url');
            const errorMsg = document.getElementById('errorMsg');

            playBtn.addEventListener('click', function () {
                const url = m3u8Url.value.trim();

                if (!url) {
                    errorMsg.textContent = 'Silakan masukkan URL M3U8';
                    return;
                }

                errorMsg.textContent = '';
                playStream(url);
            });

            function playStream(url) {
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function () {
                        video.play();
                    });
                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            errorMsg.textContent = 'Error memutar stream: ' + data.type;
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Untuk Safari yang mendukung HLS native
                    video.src = url;
                    video.addEventListener('loadedmetadata', function () {
                        video.play();
                    });
                } else {
                    errorMsg.textContent = 'Browser Anda tidak mendukung pemutaran HLS';
                }
            }

            // Optional: tekan Enter untuk play
            m3u8Url.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    playBtn.click();
                }
            });
        });
    </script>
</body>

</html>
